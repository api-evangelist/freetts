name: FreeTTS
aid: freetts
description: >-
  Cloud text-to-speech / AI voice service (freetts.org) offering neural voices across 75+ languages via a small
  REST/JSON API, plus speech-to-text, AI video and voiceover, audiobook generation, an SRT subtitle surface, and
  first-party Chrome, Edge and Firefox extensions. Built and operated by Outline Technologies (outline.ad),
  bootstrapped, founded 2025, hosted on Hetzner in Falkenstein DE behind Cloudflare. The API is a proxy over
  third-party neural TTS: the live GET /api/voices catalogue probed 2026-08-28 returned 1,410 voices across 152
  locales sourced from Google (788), Microsoft Edge (318) and Microsoft Azure (304), of which the 318 Edge voices
  are the free tier. FreeTTS publishes no OpenAPI, no apis.json, no MCP server and no agent card.
